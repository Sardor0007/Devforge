services:
  - type: web
    name: devforge
    env: python
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --run-syncdb && python manage.py shell -c \"from django.contrib.sites.models import Site; Site.objects.update_or_create(id=1, defaults={'domain': 'devforge-1-9jfn.onrender.com', 'name': 'DevForge'})\" && gunicorn devforge.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: PYTHON_VERSION
        value: 3.11.0
