<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 — Server xatosi | DevForge</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0f1e; color: #e2e8f0;
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 2rem;
  }
  .code {
    font-size: clamp(6rem, 20vw, 12rem); font-weight: 900; line-height: 1;
    background: linear-gradient(135deg, #ef4444, #f59e0b);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-family: 'Space Mono', monospace;
  }
  h1 { font-size: clamp(1.2rem, 4vw, 1.8rem); font-weight: 800; margin: 1rem 0 .75rem; }
  p { color: #94a3b8; max-width: 440px; line-height: 1.7; margin-bottom: 2rem; }
  .btn { display:inline-block; padding:.75rem 1.75rem; border-radius:10px;
    text-decoration:none; font-weight:700; font-size:.95rem; transition:.2s; }
  .btn-primary { background:#3b82f6; color:#fff; margin-right:.5rem; }
  .btn-primary:hover { background:#2563eb; }
  .btn-ghost { border:1px solid #1e2d45; color:#94a3b8; }
  .btn-ghost:hover { border-color:#3b82f6; color:#3b82f6; }
  .terminal {
    background: #111827; border: 1px solid #1e2d45; border-radius: 10px;
    padding: 1rem 1.5rem; font-family: 'Space Mono', monospace;
    font-size: .8rem; color: #ef4444; text-align: left;
    max-width: 440px; margin: 0 auto 2rem; line-height: 1.8;
  }
  .terminal .prompt { color: #64748b; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .cursor { animation: blink 1s infinite; }
</style>
</head>
<body>
  <div class="code">500</div>
  <h1>💥 Server xatosi</h1>
  <p>
    Nimadir noto'g'ri ketdi. Muhandislarimiz xabardor qilindi.
    Biroz vaqt o'tkazib, qayta urinib ko'ring.
  </p>

  <div class="terminal">
    <div><span class="prompt">$ </span>devforge --debug</div>
    <div style="color:#f59e0b;">⚠ Internal Server Error (500)</div>
    <div style="color:#64748b;">Stack trace yashirildi</div>
    <div><span class="prompt">$ </span><span class="cursor">_</span></div>
  </div>

  <div>
    <a href="/" class="btn btn-primary">🏠 Bosh sahifa</a>
    <a href="javascript:location.reload()" class="btn btn-ghost">↻ Qayta yuklash</a>
  </div>
</body>
</html>
