{% extends "base.html" %}
{% block title %}Nizo Ochish — DevForge{% endblock %}

{% block content %}
<div class="container" style="max-width:600px; margin: 4rem auto;">
    <div class="card" style="padding: 2rem; background: var(--surface); border: 1px solid var(--red);">
        <h2 style="color: var(--red); margin-bottom: 1rem;">⚖️ Nizo (Dispute) Ochish</h2>
        <p style="color: var(--text2); font-size: 0.9rem; margin-bottom: 2rem;">
            Ish: <b>{{ job.title }}</b><br>
            Nizo ochilganda ish muzlatiladi va administrator tomonidan ko'rib chiqiladi.
        </p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label style="display:block; margin-bottom:0.5rem; color:var(--text2);">Sababini batafsil yozing:</label>
                <textarea name="reason" class="form-control" rows="6" required placeholder="Nima uchun nizo ochmoqdasiz?..." style="background:var(--surface2); color:white; border-color:var(--border);"></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label style="display:block; margin-bottom:0.5rem; color:var(--text2);">Dalillar (Skrinshotlar/Hujjatlar):</label>
                <input type="file" name="evidence" class="form-control" style="background:var(--surface2); border-color:var(--border); color:var(--text3);">
            </div>

            <div style="display:flex; gap:1rem;">
                <button type="submit" class="btn btn-danger" style="flex:1;">Nizoni Ochish</button>
                <a href="{% url 'job_detail' pk=job.pk %}" class="btn btn-secondary" style="flex:1; text-align:center;">Bekor qilish</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
