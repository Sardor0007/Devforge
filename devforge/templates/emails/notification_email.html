<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — DevForge</title>
  <style>
    body {
      margin: 0; padding: 0;
      background-color: #05070a;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      background-color: #05070a;
      padding: 40px 10px;
    }
    .main-card {
      max-width: 560px;
      margin: 0 auto;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .header-bar {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      padding: 28px 32px;
      border-bottom: 1px solid #1e293b;
      text-align: left;
    }
    .brand-logo {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .brand-logo span {
      color: #38bdf8;
    }
    .content-body {
      padding: 32px;
    }
    .notif-badge {
      display: inline-block;
      padding: 4px 12px;
      background-color: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .notif-title {
      font-size: 20px;
      font-weight: 700;
      color: #f8fafc;
      margin: 0 0 12px 0;
      line-height: 1.35;
    }
    .notif-message {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }
    .action-btn {
      display: inline-block;
      padding: 14px 28px;
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      color: #0f172a !important;
      font-weight: 700;
      font-size: 14px;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }
    .footer-bar {
      padding: 24px 32px;
      background-color: #0b1329;
      border-top: 1px solid #1e293b;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
    }
    .footer-bar a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="main-card">
      <div class="header-bar">
        <a href="{{ site_url }}" class="brand-logo">Dev<span>Forge</span></a>
      </div>
      <div class="content-body">
        <div class="notif-badge">Bildirishnoma</div>
        <h1 class="notif-title">{{ title }}</h1>
        {% if message %}
        <p class="notif-message">{{ message }}</p>
        {% endif %}

        {% if action_url %}
        <a href="{{ action_url }}" class="action-btn">Tafsilotlarni Ko'rish →</a>
        {% endif %}
      </div>
      <div class="footer-bar">
        DevForge Platformasi — Ishlab chiquvchilar uchun professional ekotizim.<br>
        Ushbu email <a href="{{ site_url }}">{{ recipient_email }}</a> manziliga yuborildi.
      </div>
    </div>
  </div>
</body>
</html>
