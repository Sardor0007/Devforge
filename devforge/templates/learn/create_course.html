{% extends "base.html" %}
{% block title %}Create New Course — DevForge{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 600px;">
    <div class="card p-4">
        <h2 class="fw-bold mb-4">✨ Create New Course</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger small">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary w-100 mt-3">Next: Add Lessons →</button>
        </form>
    </div>
</div>
{% endblock %}
