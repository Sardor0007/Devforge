{% extends "base.html" %}
{% block title %}Parolni Tiklash{% endblock %}
{% block extra_css %}
<style>
.auth-page { min-height:calc(100vh - 60px); display:flex; align-items:center; justify-content:center; padding:2rem;
    background:radial-gradient(ellipse at 50% 0%, rgba(59,130,246,.1) 0%, transparent 60%); }
.auth-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:2.5rem; width:100%; max-width:440px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
</style>
{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-box">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <div style="font-size:2.5rem; margin-bottom:.5rem;">🔐</div>
      <h1 style="font-size:1.3rem; font-weight:800;">Parolni Tiklash</h1>
      <p style="color:var(--text2); font-size:.875rem; margin-top:.3rem;">
        Email manzilingizni kiriting — tiklash havolasi yuboramiz
      </p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Email manzil</label>
        <input type="email" name="email" class="form-input" placeholder="email@example.com" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center; padding:.75rem;">
        Havola Yuborish →
      </button>
    </form>
    <div style="text-align:center; margin-top:1.25rem; font-size:.875rem;">
      <a href="{% url 'login' %}" style="color:var(--accent);">← Kirishga qaytish</a>
    </div>
  </div>
</div>
{% endblock %}
