{% extends "base.html" %}
{% block title %}Xabar Yuborildi{% endblock %}
{% block extra_css %}
<style>
.auth-page { min-height:calc(100vh - 60px); display:flex; align-items:center; justify-content:center; padding:2rem; }
.auth-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:2.5rem; width:100%; max-width:440px; text-align:center; }
</style>
{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-box">
    <div style="font-size:3rem; margin-bottom:1rem;">📧</div>
    <h1 style="font-size:1.3rem; font-weight:800; margin-bottom:.75rem;">Xabar Yuborildi!</h1>
    <p style="color:var(--text2); line-height:1.7; margin-bottom:1.5rem;">
      Agar bu email ro'yxatdan o'tgan bo'lsa, parolni tiklash havolasi yuborildi.
      <strong>Spam/Junk</strong> papkasini ham tekshiring.
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary" style="justify-content:center;">← Kirishga qaytish</a>
  </div>
</div>
{% endblock %}
